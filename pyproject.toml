[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-q"
version = "0.1.0"
description = "知乎舆情监控与取证系统"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
db = ["supabase>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["core", "modules"]

[tool.pytest.ini_options]
testpaths = ["tests", "core", "modules"]
markers = ["integration: 需要真实数据库或外部网络，默认不跑"]
addopts = "-m 'not integration' --strict-markers"
